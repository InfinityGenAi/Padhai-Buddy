<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Padhai Buddy - Offline</title>
  <meta name="description" content="Padhai Buddy - Your AI Study Buddy">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/brand/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="apple-touch-icon" href="/apple-icon.png">
  <meta name="theme-color" content="#0D9488">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #0B0F14;
      color: white;
      text-align: center;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      background: linear-gradient(135deg, #0D9488 0%, #14B8A6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    p {
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 1rem;
      max-width: 320px;
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 1.75rem;
      background: linear-gradient(135deg, #0D9488 0%, #14B8A6 100%);
      color: white;
      border: none;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(13, 148, 136, 0.4); }
    .btn:active { transform: translateY(0) scale(0.98); }
    .retry-info {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
    }
    .logo {
      width: 48px;
      height: 48px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <svg class="logo" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect width="48" height="48" rx="12" fill="url(#grad)"/>
    <path d="M24 14L18 24H30L24 14Z" fill="white"/>
    <path d="M16 30H32" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18 36H30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <defs>
      <linearGradient id="grad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0D9488"/>
        <stop offset="100%" stop-color="#14B8A6"/>
      </linearGradient>
    </defs>
  </svg>
  <h1>Padhai Buddy</h1>
  <p>You're offline. Some features may not be available.</p>
  <a href="/" class="btn">Try Again</a>
  <p class="retry-info">The page will automatically retry when connection is restored.</p>
  <script>
    // Auto-retry when online
    window.addEventListener('online', () => window.location.reload());
    // Also listen for service worker message
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (navigator.serviceWorker.controller) {
          window.location.reload();
        }
      });
    }
  </script>
</body>
</html>
