name: Build Android Release APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name (e.g., 1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  packages: read

env:
  JAVA_VERSION: '21'
  GRADLE_VERSION: '8.13'
  NODE_VERSION: '20'
  CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git describe / version detection

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      # Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          emulator: false
          packages: platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125

      # Cache Node modules
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            **/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build Next.js production app
      - name: Build Next.js production app
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
          CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          CAPACITOR_BUILD: 'true'

      # Install Capacitor CLI
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli@latest

      # Sync Capacitor Android project
      - name: Sync Capacitor Android
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}
          CAPACITOR_BUILD: 'true'

      # Configure Android signing (if keystore provided)
      - name: Configure Android signing
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] && [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "Keystore provided - configuring release signing"
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
            cat << EOF > android/app/signing.properties
            storeFile=keystore.jks
            storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
            keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
            keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
            EOF
            echo "signing_configured=true" >> $GITHUB_OUTPUT
          else
            echo "No keystore provided - building unsigned APK (not suitable for Play Store)"
            echo "signing_configured=false" >> $GITHUB_OUTPUT
          fi

      # Build Release APK
      - name: Build Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx2048m"
        env:
          CAPACITOR_SERVER_URL: ${{ secrets.CAPACITOR_SERVER_URL }}
          CAPACITOR_BUILD: 'true'

      # Verify APK was built
      - name: Verify APK
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK not found at $APK_PATH"
            echo "Checking build outputs..."
            find android/app/build/outputs -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "No APK/AAB found"
            exit 1
          fi
          APK_SIZE=$(stat -c%s "$APK_PATH")
          echo "APK found: $APK_PATH (${APK_SIZE} bytes)"
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_OUTPUT

      # Determine version info
      - name: Determine version
        id: version
        run: |
          # Get version from package.json or git tag
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"  # e.g., v1.0.0
          else
            # Generate from commit: v0.1.0-commitHash
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="v0.1.0-${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "APK_NAME=padhai-buddy-${VERSION}.apk" >> $GITHUB_OUTPUT

      # Upload APK as artifact
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: padhai-buddy-apk
          path: ${{ steps.verify.outputs.APK_PATH }}
          retention-days: 30
          if-no-files-found: error

      # Create GitHub Release (only on tags or manual trigger with version)
      - name: Create GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: Padhai Buddy Android ${{ steps.version.outputs.VERSION }}
          body: |
            ## Padhai Buddy Android APK
            
            **Version:** ${{ steps.version.outputs.VERSION }}
            **Build Date:** $(date -u +"%Y-%m-%d %H:%M UTC")
            **Commit:** ${{ github.sha }}
            
            ### Installation
            1. Download the APK from this release
            2. Enable "Install from unknown sources" in Android settings (if prompted)
            3. Open the APK to install
            
            ### Features
            - AI Tutor with step-by-step explanations
            - Photo Doubt - snap a problem, get instant solutions
            - Practice Quizzes aligned to CBSE/ICSE/State Boards
            - Flashcards with spaced repetition
            - Study Planner & Focus Timer
            - Progress tracking and study streaks
            - Offline support (PWA)
            
            ### Requirements
            - Android 7.0 (API 24) or higher
            - Internet connection for AI features
            
            ---
            Built from commit: ${{ github.sha }}
          files: |
            ${{ steps.verify.outputs.APK_PATH }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Output summary
      - name: Build Summary
        run: |
          echo "## Android APK Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size | ${{ steps.verify.outputs.APK_SIZE }} bytes |" >> $GITHUB_STEP_SUMMARY
          echo "| Signed | ${{ steps.signing.outputs.signing_configured }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build URL | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**APK Artifact:** Available in Actions artifacts for 30 days" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.signing.outputs.signing_configured }}" == "true" ]; then
            echo "**✅ Signed Release APK** - Ready for distribution" >> $GITHUB_STEP_SUMMARY
          else
            echo "**⚠️ Unsigned APK** - Only for testing. Configure keystore secrets for Play Store release." >> $GITHUB_STEP_SUMMARY
          fi