name: Production Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npx next build --webpack
        env:
          FIREBASE_ADMIN_PROJECT_ID: test-project
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
          NEXT_PUBLIC_FIREBASE_API_KEY: test
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 123456789
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:abcdef
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-XXXXXXXXXX
          GROQ_API_KEY: test-groq-key

      - name: Start Firebase Emulators
        run: |
          npx firebase emulators:start --only auth:9099,firestore:8080 --project test-project &
          EMULATOR_PID=$!
          echo "EMULATOR_PID=$EMULATOR_PID" >> $GITHUB_ENV
          # Wait for both ports to be ready
          for i in {1..60}; do
            if nc -z localhost 9099 && nc -z localhost 8080; then
              echo "Emulators ready"
              break
            fi
            sleep 1
          done
          if ! nc -z localhost 9099 || ! nc -z localhost 8080; then
            echo "Emulators failed to start"
            kill $EMULATOR_PID
            exit 1
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test
        env:
          FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIREBASE_ADMIN_PROJECT_ID: test-project
          NEXT_PUBLIC_USE_EMULATORS: "true"
          NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: localhost:9099
          NEXT_PUBLIC_FIREBASE_EMULATOR_HOST: localhost:8080
          NEXT_PUBLIC_FIREBASE_API_KEY: test
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: test.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: test-project
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: test-project.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: 123456789
          NEXT_PUBLIC_FIREBASE_APP_ID: 1:123456789:web:abcdef
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: G-XXXXXXXXXX
          GROQ_API_KEY: test-groq-key

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - name: Stop Firebase Emulators
        if: always()
        run: |
          if [ -n "$EMULATOR_PID" ]; then
            kill $EMULATOR_PID 2>/dev/null || true
          fi